<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Pastri Usinagem</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b131c">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b131c;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6}
  main{max-width:34rem}
  .cod{font-size:.78rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#3d9bff}
  h1{margin:.6rem 0 0;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1}
  p{margin:1rem 0 0;color:#aab6c2}
  .acoes{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
  a.btn{display:inline-flex;align-items:center;min-height:48px;padding:.7rem 1.5rem;border-radius:999px;font-weight:700;text-decoration:none;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
  a.btn--azul{background:#0070e0;border-color:#0070e0}
  a.btn:hover{filter:brightness(1.12)}
  a:focus-visible{outline:3px solid #3d9bff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="cod">Erro 404</span>
  <h1>Não encontramos esta página.</h1>
  <p>O endereço pode ter mudado. Tudo o que você procura — serviços, selos mecânicos e contato — está na página inicial.</p>
  <div class="acoes">
    <a class="btn btn--azul" href="/">Ir para a página inicial</a>
    <a class="btn" href="/#servicos">Ver serviços</a>
    <a class="btn" href="/#contato">Falar com a Pastri</a>
  </div>
</main>
</body>
</html>
